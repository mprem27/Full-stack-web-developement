<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: sans-serif;
            background-color: #f4f4f9;
        }

        section.details {
            display: flex;
            flex-direction: column;
            gap: 15px;
            border-radius: 8px;
            padding: 25px;
            background: white;
            box-shadow: 0 5px 15px rgba(105, 40, 236, 0.3);
            width: 320px;
        }

        label {
            display: flex;
            flex-direction: column;
            font-size: 14px;
            font-weight: bold;
            gap: 5px;
        }

        input {
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            margin-top: 10px;
            cursor: pointer;
            padding: 10px;
            background: #6928ec;
            color: white;
            border: none;
            border-radius: 4px;
            
        }
        button:hover{
            border: 1px white;
            background-color: #4e21a8;
        }
    </style>
</head>

<body>
    <section class="details">
        <label>Name <input type="text" placeholder="Full Name"></label>
        <label>Email <input type="email" placeholder="student@example.com"></label>
        <label>Date of Birth <input type="date"></label>
        <label>Department <input type="text" placeholder="e.g. Computer Science"></label>
        <label>Phone <input type="tel" placeholder="1234567890"></label>
        <button>Register</button>
    </section>
</body>

</html>
